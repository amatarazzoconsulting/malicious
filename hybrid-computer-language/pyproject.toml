[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-computer-language"
version = "0.1.0"
description = "A restricted multi-syntax compiler with an expression bytecode JIT"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Anthony Matarazzo"}]

[project.scripts]
hybridlang = "hybridlang.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
